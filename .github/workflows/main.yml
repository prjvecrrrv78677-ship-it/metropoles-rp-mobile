name: Gerar APK Android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Baixar arquivos
        uses: actions/checkout@v4

      - name: Instalar ferramentas
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip wget openjdk-17-jdk

      - name: Preparar projeto
        run: |
          mkdir game
          unzip -o METROPOLES_RP_MOBILE_MARCO_2.zip -d game
          find game -name project.godot

      - name: Verificar projeto
        run: |
          test -f game/project.godot
          echo "Projeto encontrado!"
